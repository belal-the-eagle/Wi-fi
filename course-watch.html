<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة كورس الواي فاي | Belal-Sec</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #080c14; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background: #111827; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
        .logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #ef4444; font-weight: bold; }
        .logo-img { width: 35px; height: 35px; border-radius: 50%; }
        .back-btn { background: #374151; color: white; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; }
        
        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; flex: 1; width: 100%; }
        
        #locked-screen { text-align: center; background: #111827; padding: 50px 20px; border-radius: 14px; border: 1px solid #ef4444; margin-top: 40px; }
        .pay-btn { background: #25d366; color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; }

        #unlocked-screen { display: none; grid-template-columns: 2.2fr 1fr; gap: 20px; }
        @media(max-width: 900px) { #unlocked-screen { grid-template-columns: 1fr; } }

        .video-box { background: #111827; border-radius: 12px; overflow: hidden; border: 1px solid #1f2937; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .video-details { padding: 18px; }
        .video-title { font-size: 18px; color: #fff; margin-bottom: 6px; }

        /* شريط تقدم الطالب في الكورس */
        .progress-card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }
        .progress-bar-bg { width: 100%; height: 8px; background: #1f2937; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #059669); transition: width 0.4s ease; }

        .playlist-box { background: #111827; border-radius: 12px; border: 1px solid #1f2937; padding: 15px; max-height: 600px; overflow-y: auto; }
        .lesson-item { background: #0b0f19; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .lesson-item:hover { border-color: #ef4444; }
        .lesson-item.active { border-color: #10b981; background: #064e3b22; }
        .lesson-item.completed .lesson-title::after { content: "  ✅"; }

        .btn-complete { background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 10px; }
        .btn-complete:hover { background: #059669; }
    </style>
</head>
<body oncontextmenu="return false;">

    <header>
        <a href="dashboard.html" class="logo-wrap">
            <img src="logo.jpg" alt="Logo" class="logo-img">
            <span>BELAL SEC</span>
        </a>
        <a href="dashboard.html" class="back-btn">العودة للوحة الكورسات</a>
    </header>

    <div class="container">
        
        <div id="loading-screen" style="text-align: center; margin-top: 80px;">
            <h2>جاري التحقق من الاشتراك... ⏳</h2>
        </div>

        <div id="locked-screen" style="display: none;">
            <h2 style="color:#ef4444; margin-bottom:10px;">عذراً، هذا الكورس غير مفعل لحسابك 🔒</h2>
            <p style="color:#9ca3af;">تواصل مع المهندس بلال ندى لتفعيل حسابك فوراً على المنصة.</p>
            <a href="https://wa.me/201062808277?text=السلام%20عليكم%20يا%20باشمهندس%20بلال،%20أريد%20تفعيل%20كورس%20الواي%20فاي" target="_blank" class="pay-btn">تواصل عبر واتساب للتفعيل 💬</a>
        </div>

        <div id="unlocked-screen">
            <div>
                <div class="video-box">
                    <div class="video-container">
                        <iframe id="courseVideo" src="" allowfullscreen></iframe>
                    </div>
                    <div class="video-details">
                        <h2 class="video-title" id="currentLessonTitle">اختر درساً</h2>
                        <p id="currentLessonDesc" style="color: #9ca3af; font-size: 13px;"></p>
                        <button class="btn-complete" onclick="markCompleted()">إكمال هذا الدرس ✅</button>
                    </div>
                </div>
            </div>

            <!-- قائمة الجانب مع شريط التقدم -->
            <div>
                <div class="progress-card">
                    <div class="progress-info">
                        <span>إنجازك في الكورس</span>
                        <span id="progressText">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressBar"></div>
                    </div>
                </div>

                <div class="playlist-box">
                    <h3 style="font-size:15px; margin-bottom:12px; color:#fff;">دروس الكورس</h3>
                    <div id="playlistContainer"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://wezenatztndbljntrdfq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_soSiIGjOqn0dC605mFsmDg_W0GQooi_';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserEmail = "";
        let currentLessonId = 1;
        let completedLessons = JSON.parse(localStorage.getItem('completed_lessons') || '[]');

        const courseData = [
            { id: 1, title: "الدرس الأول: مقدمة ونظرة عامة", desc: "أساسيات وتطبيقات الشبكات اللاسلكية.", duration: "10 دقائق", youtubeId: "dQw4w9WgXcQ" },
            { id: 2, title: "الدرس الثاني: تجهيز بيئة antiX Linux", desc: "إعداد الأواومر والبيئة الخاصة بالاختبار.", duration: "25 دقيقة", youtubeId: "dQw4w9WgXcQ" }
        ];

        async function verifyAndLoadCourse() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            currentUserEmail = session.user.email;
            const { data, error } = await supabaseClient.from('subscriptions').select('*').eq('email', currentUserEmail).eq('course_name', 'wifi');

            document.getElementById('loading-screen').style.display = 'none';

            let isAuthorized = false;
            if (data && data.length > 0) {
                const activeVal = data[0].is_active;
                if (activeVal === true || activeVal === 'true' || activeVal === 'TRUE' || activeVal === 1) isAuthorized = true;
            }

            if (error || !isAuthorized) {
                document.getElementById('locked-screen').style.display = 'block';
            } else {
                document.getElementById('unlocked-screen').style.display = 'grid';
                loadPlaylist();
                changeLesson(courseData[0].id);
                updateProgressBar();
            }
        }

        function loadPlaylist() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';
            courseData.forEach((lesson, index) => {
                const isDone = completedLessons.includes(lesson.id) ? 'completed' : '';
                container.innerHTML += `
                    <div class="lesson-item ${isDone}" id="lesson-${lesson.id}" onclick="changeLesson(${lesson.id})">
                        <div class="lesson-title" style="font-size:13px; font-weight:bold; color:#fff;">${lesson.title}</div>
                        <div style="font-size:11px; color:#9ca3af; margin-top:4px;">⏱️ ${lesson.duration}</div>
                    </div>
                `;
            });
        }

        function changeLesson(id) {
            currentLessonId = id;
            const lesson = courseData.find(l => l.id === id);
            if (!lesson) return;

            document.getElementById('courseVideo').src = `https://www.youtube.com/embed/${lesson.youtubeId}?rel=0`;
            document.getElementById('currentLessonTitle').innerText = lesson.title;
            document.getElementById('currentLessonDesc').innerText = lesson.desc;

            document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`lesson-${id}`).classList.add('active');
        }

        function markCompleted() {
            if (!completedLessons.includes(currentLessonId)) {
                completedLessons.push(currentLessonId);
                localStorage.setItem('completed_lessons', JSON.stringify(completedLessons));
                loadPlaylist();
                updateProgressBar();
            }
        }

        function updateProgressBar() {
            const percent = Math.round((completedLessons.length / courseData.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '%';
        }

        verifyAndLoadCourse();
    </script>
</body>
</html>
